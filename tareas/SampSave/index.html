<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SampSave - Historial de Versiones</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent: #2ecc71;
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
            --danger: #e74c3c;
            --blue: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-around;
            padding: 20px 0;
            border-bottom: 1px solid #333;
        }

        nav i { font-size: 24px; cursor: pointer; color: var(--text-dim); transition: 0.3s; }
        nav i:hover { color: white; }

        section { width: 90%; max-width: 600px; padding: 20px 0; display: none; }
        .active { display: block; }

        /* HERO */
        .hero-box { text-align: center; line-height: 1.6; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        button { padding: 12px; border-radius: 5px; border: none; background: #333; color: white; cursor: pointer; font-weight: bold; }

        /* LIBRERÍA */
        .project-card {
            background: var(--card-bg);
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        /* FORMULARIO */
        .upload-area { border: 2px dashed #444; padding: 40px; text-align: center; border-radius: 10px; margin-bottom: 20px; cursor: pointer; }
        input[type="text"] { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: white; box-sizing: border-box; border-radius: 5px; margin-bottom: 10px; }
        #btn-guardar { width: 100%; background: #444; color: #888; cursor: not-allowed; }
        #btn-guardar.ready { background: var(--accent); color: white; cursor: pointer; }

        /* REPRODUCTOR Y VERSIONES */
        .audio-player-box { background: #282828; padding: 20px; border-radius: 10px; margin: 10px 0; }
        audio { width: 100%; filter: invert(100%) hue-rotate(180deg); }
        
        .history-list { margin-top: 20px; border-top: 1px solid #333; padding-top: 15px; }
        .version-item {
            background: #1a1a1a;
            padding: 12px;
            margin-top: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }

        .tag { background: var(--accent); color: black; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.7rem; }
        .action-btns { display: flex; gap: 10px; margin-top: 15px; }
        
        textarea { width: 100%; height: 100px; background: #1a1a1a; color: #ccc; padding: 10px; border: 1px solid #333; margin-top: 10px; border-radius: 5px; resize: none; }
    </style>
</head>
<body>

    <nav id="top-nav">
        <i class="fas fa-home" onclick="navTo('home')"></i>
        <i class="fas fa-plus" onclick="prepareNewProject()"></i>
        <i class="fas fa-book" onclick="navTo('library')"></i>
    </nav>

    <section id="home" class="active">
        <div class="hero-box">
            <h1>SampSave</h1>
            <p>Tu estudio de bolsillo. Sube, compara y organiza versiones de tus canciones.</p>
            <div class="btn-grid">
                <button onclick="navTo('library')">LIBRERÍA</button>
                <button onclick="prepareNewProject()" style="background: var(--accent)">NUEVO TRACK</button>
            </div>
        </div>
    </section>

    <section id="library">
        <h2>MIS PROYECTOS</h2>
        <div id="project-list"></div>
    </section>

    <section id="add-audio">
        <div class="back-nav">
            <i class="fas fa-arrow-left" onclick="navTo('home')"></i>
            <h2 id="upload-title">Nuevo Proyecto</h2>
        </div>
        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <i class="fas fa-file-upload" style="font-size: 40px; color: var(--blue);"></i>
            <p id="file-status">Click para seleccionar audio</p>
            <input type="file" id="file-input" hidden accept=".mp3,.wav" onchange="checkFile()">
        </div>
        <input type="text" id="proj-name" placeholder="Nombre de la canción">
        <input type="text" id="proj-version" placeholder="Nombre de esta versión (Ej: V1, Rough Mix, Master)">
        
        <button id="btn-guardar" disabled onclick="saveData()">GUARDAR</button>
    </section>

    <section id="project-details">
        <div class="back-nav">
            <i class="fas fa-arrow-left" onclick="navTo('library')"></i>
            <h2 id="detail-title">Proyecto</h2>
        </div>

        <div class="audio-player-box">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span id="current-ver-name" class="tag">VERSIÓN ACTUAL</span>
                <small id="current-file-info" style="color:var(--text-dim)"></small>
            </div>
            <audio id="player" controls></audio>
        </div>

        <div class="action-btns">
            <button onclick="prepareUpdate()" style="background: var(--blue); flex: 2;">
                <i class="fas fa-plus"></i> NUEVA VERSIÓN (SOBREESCRIBIR)
            </button>
            <button id="main-download" style="background: #444;">
                <i class="fas fa-download"></i>
            </button>
            <button onclick="deleteProject()" style="background: var(--danger);">
                <i class="fas fa-trash"></i>
            </button>
        </div>

        <textarea id="proj-notes" placeholder="Notas sobre la mezcla, BPM, letras..."></textarea>

        <div class="history-list">
            <h3>Versiones anteriores</h3>
            <div id="history-container"></div>
        </div>
    </section>

    <script>
        let db = []; 
        let currentIdx = null;
        let mode = 'new'; // 'new' o 'update'

        function navTo(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('top-nav').style.visibility = (id === 'add-audio' || id === 'project-details') ? 'hidden' : 'visible';
            if(id === 'library') renderLibrary();
        }

        function prepareNewProject() {
            mode = 'new';
            document.getElementById('upload-title').innerText = "Nuevo Proyecto";
            document.getElementById('proj-name').style.display = "block";
            document.getElementById('proj-name').value = "";
            document.getElementById('proj-version').value = "";
            document.getElementById('file-input').value = "";
            document.getElementById('file-status').innerText = "Click para seleccionar audio";
            navTo('add-audio');
        }

        function prepareUpdate() {
            mode = 'update';
            document.getElementById('upload-title').innerText = "Subir Nueva Versión";
            document.getElementById('proj-name').style.display = "none"; 
            document.getElementById('proj-version').value = "";
            document.getElementById('file-input').value = "";
            document.getElementById('file-status').innerText = "Selecciona el nuevo archivo";
            navTo('add-audio');
        }

        function checkFile() {
            const file = document.getElementById('file-input').files[0];
            const btn = document.getElementById('btn-guardar');
            if(file) {
                document.getElementById('file-status').innerText = "Archivo: " + file.name;
                btn.disabled = false;
                btn.classList.add('ready');
            }
        }

        function saveData() {
            const fileInput = document.getElementById('file-input');
            const nameInput = document.getElementById('proj-name');
            const verInput = document.getElementById('proj-version');

            if(!fileInput.files[0] || !verInput.value) return alert("Rellena los datos");

            const newFile = {
                vName: verInput.value,
                fName: fileInput.files[0].name,
                url: URL.createObjectURL(fileInput.files[0]),
                date: new Date().toLocaleDateString()
            };

            if(mode === 'new') {
                db.push({
                    name: nameInput.value || "Sin título",
                    current: newFile,
                    history: [],
                    notes: ""
                });
            } else {
                // Al actualizar, el "current" actual pasa al historial
                db[currentIdx].history.unshift({...db[currentIdx].current});
                db[currentIdx].current = newFile;
            }
            navTo('library');
        }

        function renderLibrary() {
            const list = document.getElementById('project-list');
            if(db.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:gray; margin-top:30px;">No hay proyectos todavía.</p>`;
                return;
            }
            list.innerHTML = db.map((p, i) => `
                <div class="project-card">
                    <div><strong>${p.name}</strong><br><small>${p.current.vName}</small></div>
                    <button onclick="openProject(${i})" style="background:var(--accent); color:black">ABRIR</button>
                </div>
            `).join('');
        }

        function openProject(i) {
            currentIdx = i;
            const p = db[i];
            const player = document.getElementById('player');
            
            document.getElementById('detail-title').innerText = p.name;
            document.getElementById('current-ver-name').innerText = p.current.vName;
            document.getElementById('current-file-info').innerText = p.current.fName;
            document.getElementById('proj-notes').value = p.notes;
            player.src = p.current.url;

            document.getElementById('main-download').onclick = () => download(p.current.url, p.current.fName);

            renderHistory(p.history);
            navTo('project-details');
        }

        function renderHistory(history) {
            const container = document.getElementById('history-container');
            if(history.length === 0) {
                container.innerHTML = `<p style="color:gray; font-size:0.8rem;">No hay versiones anteriores.</p>`;
                return;
            }
            container.innerHTML = history.map(h => `
                <div class="version-item">
                    <span><strong>${h.vName}</strong><br><small style="color:gray">${h.fName}</small></span>
                    <div>
                        <button onclick="playSource('${h.url}', '${h.vName}')" style="background:#444; margin-right:5px;">
                            <i class="fas fa-play"></i>
                        </button>
                        <button onclick="download('${h.url}', '${h.fName}')" style="background:#444;">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function playSource(url, name) {
            const player = document.getElementById('player');
            player.src = url;
            player.play();
            // Avisar al usuario qué está escuchando
            document.getElementById('current-ver-name').innerText = name + " (Antigua)";
        }

        function download(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
        }

        function deleteProject() {
            if(confirm("¿Eliminar este proyecto y todo su historial?")) {
                db.splice(currentIdx, 1);
                navTo('library');
            }
        }

        // Auto-guardado de notas
        document.getElementById('proj-notes').addEventListener('input', (e) => {
            db[currentIdx].notes = e.target.value;
        });
    </script>
</body>
</html>
