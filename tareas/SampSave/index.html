<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SampSave - Audio Library & Versioning</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent: #2ecc71;
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
            --danger: #e74c3c;
            --blue: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-around;
            padding: 20px 0;
            border-bottom: 1px solid #333;
        }

        nav i { font-size: 24px; cursor: pointer; color: var(--text-dim); transition: 0.3s; }
        nav i:hover { color: white; }

        section { width: 90%; max-width: 600px; padding: 20px 0; display: none; }
        .active { display: block; }

        /* HERO & BUTTONS */
        .hero-box { text-align: center; line-height: 1.6; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        button { padding: 12px; border-radius: 5px; border: none; background: #333; color: white; cursor: pointer; font-weight: bold; }

        /* LIBRERÍA */
        .project-card {
            background: var(--card-bg);
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        /* UPLOAD AREA */
        .upload-area { border: 2px dashed #444; padding: 40px; text-align: center; border-radius: 10px; margin-bottom: 20px; cursor: pointer; }
        input[type="text"] { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: white; box-sizing: border-box; border-radius: 5px; margin-bottom: 10px; }
        #btn-guardar { width: 100%; background: #444; color: #888; cursor: not-allowed; }
        #btn-guardar.ready { background: var(--accent); color: white; cursor: pointer; }

        /* PLAYER & VERSIONS */
        .audio-player-container { background: #282828; padding: 20px; border-radius: 10px; margin: 10px 0; }
        audio { width: 100%; filter: invert(100%) hue-rotate(180deg); }
        
        .history-section { margin-top: 25px; border-top: 1px solid #333; padding-top: 15px; }
        .history-item {
            background: #1a1a1a;
            padding: 10px;
            margin-top: 8px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .version-badge { background: var(--accent); color: black; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.7rem; }
        
        .action-bar { display: flex; gap: 8px; margin-top: 15px; }
        .btn-update { background: var(--blue); flex: 2; }
        .btn-delete { background: var(--danger); flex: 0.5; }

        textarea { width: 100%; height: 100px; background: #1a1a1a; color: #ccc; padding: 10px; border: 1px solid #333; margin-top: 10px; border-radius: 5px; resize: none; }
    </style>
</head>
<body>

    <nav id="top-nav">
        <i class="fas fa-home" onclick="navTo('home')"></i>
        <i class="fas fa-plus" onclick="initNewProject()"></i>
        <i class="fas fa-book" onclick="navTo('library')"></i>
    </nav>

    <section id="home" class="active">
        <div class="hero-box">
            <h1>SampSave</h1>
            <p>Almacena tus maquetas y mantén un historial de versiones de cada pista. No pierdas nunca una idea anterior.</p>
            <div class="btn-grid">
                <button onclick="navTo('library')">VER LIBRERÍA</button>
                <button onclick="initNewProject()" style="background: var(--accent)">NUEVO PROYECTO</button>
            </div>
        </div>
    </section>

    <section id="library">
        <h2>TU LIBRERÍA</h2>
        <div id="project-list"></div>
    </section>

    <section id="add-audio">
        <div class="back-nav">
            <i class="fas fa-arrow-left" onclick="navTo('home')"></i>
            <h2 id="upload-title">Nuevo Proyecto</h2>
        </div>
        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <i class="fas fa-cloud-upload-alt" style="font-size: 40px; color: var(--blue);"></i>
            <p id="file-status">Seleccionar archivo WAV/MP3</p>
            <input type="file" id="file-input" hidden accept=".mp3,.wav" onchange="checkFile()">
        </div>
        <div id="meta-fields">
            <input type="text" id="proj-name" placeholder="Nombre del proyecto">
            <input type="text" id="proj-version" placeholder="Versión (ej: V1, Master, Rough)">
        </div>
        <button id="btn-guardar" disabled onclick="handleSave()">Guardar Cambios</button>
    </section>

    <section id="project-details">
        <div class="back-nav">
            <i class="fas fa-arrow-left" onclick="navTo('library')"></i>
            <h2 id="detail-title">Proyecto</h2>
        </div>

        <div class="audio-player-container">
            <div style="margin-bottom:10px; display:flex; justify-content:space-between;">
                <span id="detail-version-tag" class="version-badge">VERSION ACTUAL</span>
                <small id="detail-filename" style="color:var(--text-dim)"></small>
            </div>
            <audio id="main-player" controls></audio>
        </div>

        <div class="action-bar">
            <button class="btn-update" onclick="prepareUpdate()">
                <i class="fas fa-sync-alt"></i> ACTUALIZAR AUDIO (NUEVA VERSIÓN)
            </button>
            <button id="btn-main-download" class="btn-update" style="background:#444">
                <i class="fas fa-download"></i>
            </button>
            <button class="btn-delete" onclick="deleteProject()">
                <i class="fas fa-trash"></i>
            </button>
        </div>

        <textarea id="detail-notes" placeholder="Notas de producción o letras..."></textarea>

        <div class="history-section">
            <h3>Historial de versiones</h3>
            <div id="version-history-list">
                </div>
        </div>
    </section>

    <script>
        let db = []; 
        let currentProjectIndex = null;
        let isUpdating = false;

        function navTo(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('top-nav').style.visibility = (id === 'add-audio' || id === 'project-details') ? 'hidden' : 'visible';
            if(id === 'library') renderLibrary();
        }

        function initNewProject() {
            isUpdating = false;
            document.getElementById('upload-title').innerText = "Nuevo Proyecto";
            document.getElementById('proj-name').style.display = "block";
            document.getElementById('proj-name').value = "";
            document.getElementById('proj-version').value = "";
            document.getElementById('file-status').innerText = "Seleccionar archivo WAV/MP3";
            navTo('add-audio');
        }

        function prepareUpdate() {
            isUpdating = true;
            document.getElementById('upload-title').innerText = "Actualizar Versión";
            document.getElementById('proj-name').style.display = "none"; // No cambiamos el nombre al actualizar
            document.getElementById('proj-version').value = "";
            document.getElementById('file-status').innerText = "Seleccionar el nuevo archivo";
            navTo('add-audio');
        }

        function checkFile() {
            const file = document.getElementById('file-input').files[0];
            const btn = document.getElementById('btn-guardar');
            if(file) {
                document.getElementById('file-status').innerText = "Listo: " + file.name;
                btn.disabled = false;
                btn.classList.add('ready');
            }
        }

        function handleSave() {
            const fileInput = document.getElementById('file-input');
            const verInput = document.getElementById('proj-version');
            const nameInput = document.getElementById('proj-name');

            if(!fileInput.files[0] || !verInput.value) return alert("Falta archivo o versión");

            const fileData = {
                name: fileInput.files[0].name,
                version: verInput.value,
                url: URL.createObjectURL(fileInput.files[0]),
                date: new Date().toLocaleDateString()
            };

            if(isUpdating) {
                // Movemos la versión actual al historial antes de cambiarla
                const p = db[currentProjectIndex];
                p.history.unshift({...p.current}); 
                p.current = fileData;
            } else {
                // Nuevo proyecto
                db.push({
                    name: nameInput.value || "Sin nombre",
                    current: fileData,
                    history: [],
                    notes: ""
                });
            }
            navTo('library');
        }

        function renderLibrary() {
            const container = document.getElementById('project-list');
            if(db.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:gray; margin-top:20px;">Librería vacía</p>`;
                return;
            }
            container.innerHTML = db.map((p, i) => `
                <div class="project-card">
                    <div>
                        <strong>${p.name}</strong><br>
                        <small style="color:var(--accent)">Actual: ${p.current.version}</small>
                    </div>
                    <button onclick="openProject(${i})" style="background:var(--accent); color:black">ABRIR</button>
                </div>
            `).join('');
        }

        function openProject(index) {
            currentProjectIndex = index;
            const p = db[index];
            const player = document.getElementById('main-player');
            
            document.getElementById('detail-title').innerText = p.name;
            document.getElementById('detail-version-tag').innerText = p.current.version;
            document.getElementById('detail-filename').innerText = p.current.name;
            document.getElementById('detail-notes').value = p.notes;
            player.src = p.current.url;

            document.getElementById('btn-main-download').onclick = () => download(p.current.url, p.current.name);

            renderHistory(p.history);
            navTo('project-details');
        }

        function renderHistory(history) {
            const container = document.getElementById('version-history-list');
            if(history.length === 0) {
                container.innerHTML = `<p style="color:gray; font-size:0.8rem;">No hay versiones anteriores</p>`;
                return;
            }
            container.innerHTML = history.map(h => `
                <div class="history-item">
                    <span><strong>${h.version}</strong> - ${h.name}</span>
                    <div>
                        <i class="fas fa-play" style="cursor:pointer; margin-right:15px;" onclick="previewHistory('${h.url}')"></i>
                        <i class="fas fa-download" style="cursor:pointer;" onclick="download('${h.url}', '${h.name}')"></i>
                    </div>
                </div>
            `).join('');
        }

        function previewHistory(url) {
            const player = document.getElementById('main-player');
            player.src = url;
            player.play();
        }

        function download(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
        }

        function deleteProject() {
            if(confirm("¿Borrar todo el proyecto y su historial?")) {
                db.splice(currentProjectIndex, 1);
                navTo('library');
            }
        }

        document.getElementById('detail-notes').addEventListener('input', (e) => {
            db[currentProjectIndex].notes = e.target.value;
        });
    </script>
</body>
</html>
